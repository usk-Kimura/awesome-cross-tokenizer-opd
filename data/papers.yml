schema_version: 1
last_verified: "2026-08-15"

conventions:
  pair_direction: "teacher_to_student"
  verified_meaning: "Checked against public full text; not independently reproduced."
  core_criteria:
    - "Public English paper or preprint"
    - "Teacher supervision on student-generated rollouts or student-visited states"
    - "Explicit tokenizer or vocabulary mismatch"
    - "Concrete interface across the mismatch"
    - "Reported training experiment with a mismatched pair"

classifications:
  core_output_space: "Core OPD method that constructs comparable output-space events or distributions."
  core_vocabulary_bypassing: "Core OPD method that bypasses direct vocabulary-distribution mapping."
  evaluation_interface_under_specified: "Cross-vocabulary OPD result is reported, but the bridge is not documented sufficiently."
  paper_claim_implementation_concern: "The paper reports cross-tokenizer OPD, but the audited public implementation does not preserve text semantics across tokenizers."
  boundary_application: "Uses student/drafter-generated states in an adjacent application, but is not canonical full-response OPD."
  framework: "Paper describing software support rather than a new cross-tokenizer OPD interface."
  implementation_resource: "Non-paper implementation or research article."

